Plugin:
  Prefix: '&7[&cFriends&7] &r'
  Default-Language: english
  Enable-Aliases:
    /msg: true
    /tell: true
    /message: true
    /f: true
    /r: true
    /reply: true
    /fl: true
    /block: true
    /ignore: true
    /pc: true
    /ac: true
    /achat: true
    /pl: true
    /w: true
    /whisper: true
  Enable-Server-Switch-Notifier: true
  Enable-Party-Warp: true
  Enable-LuckPerms-API: true
  Enable-Hyphen: true
  Hyphen:
    Categories:
      Enable-Command-Results: true
      Enable-Lists: true
      Enable-Party-Notifications: true
      Enable-Warp-Notifications: true
    # Message-specific values override the category setting. Valid IDs are declared by the plugin.
    # Example: PARTY_MUTE_DENIED: false
    Messages: {}
  Enable-Tab-Complete: true
  Enable-Party-Command-Sender: true
  Enable-Bungee-Parties: false
  Enable-Status: true
  Enable-Legacy-Prefix-YML: false
  Friend-List:
    Enable-Color-Only-Prefix: false
    Time-Format: yyyy-MM-dd HH:mm:ss
    Sort:
      1:
        No-Color-Prefix: '[ADMIN]'
        Priority: 1
      2:
        No-Color-Prefix: '[MOD]'
        Priority: 2
  # All duration and interval values use ticks (1 tick = 50 ms).
  Party:
    Max-Size: 10
    Disband-Delay-Ticks: 6000
    Offline-Member-Kick-Delay-Ticks: 6000
  Enable-Friend-Removal-Notifications: true
  LuckPerms:
    Offline-Prefix-Cache-Ticks: 36000
    Offline-Prefix-Load-Timeout-Ticks: 40
  Party-Warp:
    Enable-Confirmation: false
    Confirm-Timeout-Ticks: 200
    Game-Servers: []
    Initial-Delay-Ticks: 10
    Member-Interval-Ticks: 2
    Lobby-Server-Name-Contains: lobby
    Enable-Server-Blocklist: true
    Server-Blocklist: []
  # Rules are checked in order; the first matching rule supplies the display name.
  # PREFIX, CONTAINS, and EXACT are case-sensitive. EXACT_IGNORE_CASE ignores letter case.
  Server-Name-Display:
    Rules:
      - Match-Mode: PREFIX
        Pattern: lobby-
        Display-Name: Lobby
      - Match-Mode: CONTAINS
        Pattern: game
        Display-Name: Game
      - Match-Mode: EXACT_IGNORE_CASE
        Pattern: sw-1
        Display-Name: SkyWars
  Bungee-Parties:
    Party-Command-Sender:
      1:
        Leader: /join
        Member: '/join $args'
      2:
        Leader: /sw join
        Member: '/sw join $args'
