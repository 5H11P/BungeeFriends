Plugin:
  Prefix: '&7[&cFriends&7] &r'
  Default-Language: english
  Disable-Aliases:
    /msg: false
    /tell: false
    /message: false
    /f: false
    /r: false
    /reply: false
    /fl: false
    /block: false
    /ignore: false
    /pc: false
    /ac: false
    /achat: false
    /pl: false
    /w: false
    /whisper: false
  Disable-Server-Switch-Notifier: false
  Disable-Party-Warp: false
  Disable-LuckPerms-API: false
  Disable-Hyphen: false
  Hyphen:
    Categories:
      Command-Results: true
      Lists: true
      Party-Notifications: true
      Warp-Notifications: true
    # Message-specific values override the category setting. Valid IDs are declared by the plugin.
    # Example: PARTY_MUTE_DENIED: false
    Messages: {}
  Disable-Tab-Complete: false
  Disable-Party-Command-Sender: false
  Enable-Bungee-Parties: false
  Enable-Status: true
  Enable-Deprecated-Prefix-YML: false
  Friend-List:
    No-Prefix: false
    Time-Format: yyyy-MM-dd HH:mm:ss
    Sort:
      1:
        No-Color-Prefix: '[ADMIN]'
        Priority: 1
      2:
        No-Color-Prefix: '[MOD]'
        Priority: 2
  Party:
    Max-Size: 10
    Disband-Delay-Minutes: 5
    Offline-Member-Kick-Delay-Minutes: 5
  Notify-Removed-Friend: true
  LuckPerms:
    Offline-Prefix-Cache-Minutes: 30
    Offline-Prefix-Load-Timeout-Seconds: 2
  Party-Warp:
    Enable-Confirmation: false
    Confirm-Timeout-Seconds: 10
    Game-Servers: []
    Initial-Delay-Seconds: '0.5'
    Member-Interval-Seconds: '0.1'
    Lobby-Server-Name-Contains: lobby
    Server-Blocklist:
      Enabled: true
      Servers: []
  Server-Name:
    1:
      Type: startsWith
      Server-Name: lobby-
      Replace-Name: Lobby
    2:
      Type: contains
      Server-Name: game
      Replace-Name: Game
    3:
      Type: equalsIgnoreCase
      Server-Name: sw-1
      Replace-Name: SkyWars
  Bungee-Parties:
    Party-Command-Sender:
      1:
        Leader: /join
        Member: '/join $args'
      2:
        Leader: /sw join
        Member: '/sw join $args'
