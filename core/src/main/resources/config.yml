Plugin:
  Prefix: '&7[&cFriends&7] &r'
  Default-Language: english
  Enable-Aliases:
    /msg: true
    /tell: true
    /message: true
    /f: true
    /r: true
    /reply: true
    /fl: true
    /block: true
    /ignore: true
    /pc: true
    /ac: true
    /achat: true
    /pl: true
    /w: true
    /whisper: true
  Enable-Server-Switch-Notifier: true
  Enable-Party-Warp: true
  Enable-LuckPerms-API: true
  Enable-Tab-Complete: true
  Enable-Bungee-Parties: true
  Enable-Status: true
  # Length limits use Java String.length() (UTF-16 units) and may be set from 1 to 255.
  Friend:
    Max-Note-Length: 100
    Max-Nickname-Length: 16
    Max-Prefix-Length: 16
  # All duration and interval values use ticks (1 tick = 50 ms).
  Party:
    Max-Size: 10
    Disband-Delay-Ticks: 6000
    Offline-Member-Kick-Delay-Ticks: 6000
  Enable-Friend-Removal-Notifications: true
  LuckPerms:
    Offline-Prefix-Cache-Ticks: 36000
    Offline-Prefix-Load-Timeout-Ticks: 40
  Party-Warp:
    Enable-Confirmation: false
    Confirm-Timeout-Ticks: 200
    Game-Servers: []
    Initial-Delay-Ticks: 10
    Member-Interval-Ticks: 2
    Lobby-Server-Name-Contains: lobby
    Enable-Server-Blocklist: true
    Server-Blocklist: []
  Bungee-Parties: {}
