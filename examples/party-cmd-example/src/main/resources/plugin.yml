name: PartyCmdSenderExample
main: net.simplyrin.bungeefriends.api.spigot.example.PartyCmdSenderExample
version: 2.4
api-version: 1.13
author: 5H11P
depend: [BungeeFriend-SpigotAPI]
description: Sends an allowed command to one online party member.
commands:
  partycmd:
    description: Queue a command for a party member.
    usage: /partycmd <member> <command> [args...]
    permission: partycmdexample.use
permissions:
  partycmdexample.use:
    default: true
